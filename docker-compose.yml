services:
  bot:
    build:
      context: ./bot
    command: ["sh", "-c", "[ -d node_modules/.bin ] || npm ci; npx prisma generate && npx prisma migrate deploy && npm run dev"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    volumes:
      - ./bot:/app
      - bot_node_modules:/app/node_modules
      - ./bot/media:/app/media
    networks:
      - backend
    init: true
    restart: unless-stopped

  media-worker:
    build:
      context: ./bot
    command: ["sh", "-c", "[ -d node_modules/.bin ] || npm ci; npx prisma generate && npx prisma migrate deploy && npm run dev:media-worker"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    volumes:
      - ./bot:/app
      - bot_node_modules:/app/node_modules
      - ./bot/media:/app/media
    networks:
      - backend
    init: true
    restart: unless-stopped

  xray-subscription:
    build:
      context: ./bot
    command: ["sh", "-c", "[ -d node_modules/.bin ] || npm ci; npx prisma generate && npx prisma migrate deploy && npm run dev:subscription"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    volumes:
      - ./bot:/app
      - bot_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${XRAY_SUBSCRIPTION_PORT:-18081}:${XRAY_SUBSCRIPTION_PORT:-18081}"
    networks:
      - backend
    init: true
    restart: unless-stopped

  vpn-bot:
    image: mozhnobot-bot
    command: ["sh", "-c", "[ -d node_modules/.bin ] || npm ci; npx prisma generate && npx prisma migrate deploy && npm run dev:vpn-bot"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    volumes:
      - ./bot:/app
      - bot_node_modules:/app/node_modules
    networks:
      - backend
    init: true
    restart: unless-stopped

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - ./postgres/db_data:/var/lib/postgresql
      - ./postgres/backups:/backups
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

volumes:
  bot_node_modules:

networks:
  backend:
    driver: bridge
