services:
  bot:
    build:
      context: ./bot
    command: ["sh", "-c", "[ -d node_modules/.bin ] || npm ci; npx prisma generate && npx prisma migrate deploy && npm run dev"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    volumes:
      - ./bot:/app
      - bot_node_modules:/app/node_modules
      - ./bot/media:/app/media
    networks:
      - backend
    dns:
      - 1.1.1.1
      - 8.8.8.8
    init: true
    restart: unless-stopped

  media-worker:
    build:
      context: ./bot
    command: ["sh", "-c", "[ -d node_modules/.bin ] || npm ci; npx prisma generate && npx prisma migrate deploy && npm run dev:media-worker"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    volumes:
      - ./bot:/app
      - bot_node_modules:/app/node_modules
      - ./bot/media:/app/media
    networks:
      - backend
    dns:
      - 1.1.1.1
      - 8.8.8.8
    init: true
    restart: unless-stopped

  xray-subscription:
    build:
      context: ./bot
    command: ["sh", "-c", "[ -d node_modules/.bin ] || npm ci; npx prisma generate && npx prisma migrate deploy && npm run dev:subscription"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    volumes:
      - ./bot:/app
      - bot_node_modules:/app/node_modules
    ports:
      - "${XRAY_SUBSCRIPTION_PORT:-18081}:18081"
    networks:
      - backend
    dns:
      - 1.1.1.1
      - 8.8.8.8
    init: true
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2025.6.1
    command: tunnel --no-autoupdate --protocol http2 --region us run --token ${CLOUDFLARED_TUNNEL_TOKEN:-}
    depends_on:
      - xray-subscription
    network_mode: host
    restart: unless-stopped
    profiles:
      - tunnel

  amneziya:
    build:
      context: ./amneziya
    command: ["sh", "-c", "[ -d node_modules/.bin ] || npm install; npm run dev"]
    environment:
      NODE_ENV: development
      NO_COLOR: "1"
      FORCE_COLOR: "0"
      AMNEZIA_AGENT_TOKEN: ${AMNEZIA_AGENT_TOKEN:-dev-amneziya-agent-token}
      AMNEZIA_AGENT_HOST: 0.0.0.0
      AMNEZIA_AGENT_PORT: 8080
      AMNEZIA_INTERFACE: ${AMNEZIA_INTERFACE:-awg0}
      AMNEZIA_SERVER_HOST: ${AMNEZIA_SERVER_HOST:-127.0.0.1}
      AMNEZIA_SERVER_PORT: ${AMNEZIA_SERVER_PORT:-51820}
      AMNEZIA_CLIENT_CIDR: ${AMNEZIA_CLIENT_CIDR:-10.9.9.0/24}
      AMNEZIA_DNS: ${AMNEZIA_DNS:-1.1.1.1}
      AMNEZIA_CONFIG_PATH: /etc/amnezia/amneziawg/awg0.conf
      AMNEZIA_AGENT_DB_PATH: /var/lib/amnezia-agent/agent.db
      AMNEZIA_BACKUP_DIR: /var/backups/amnezia-agent
      AMNEZIA_TRAFFIC_POLL_INTERVAL_MS: ${AMNEZIA_TRAFFIC_POLL_INTERVAL_MS:-60000}
      AMNEZIA_EXPIRATION_POLL_INTERVAL_MS: ${AMNEZIA_EXPIRATION_POLL_INTERVAL_MS:-60000}
    volumes:
      - ./amneziya:/app
      - amneziya_node_modules:/app/node_modules
      - ${AMNEZIA_CONFIG_DIR:-./amneziya/dev/amneziawg}:/etc/amnezia/amneziawg
      - ${AMNEZIA_AGENT_DATA_DIR:-./amneziya/dev/data}:/var/lib/amnezia-agent
      - ${AMNEZIA_AGENT_BACKUP_DIR:-./amneziya/dev/backups}:/var/backups/amnezia-agent
    ports:
      - "${AMNEZIA_AGENT_PORT:-8080}:8080"
    networks:
      - backend
    init: true
    restart: unless-stopped

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - ./postgres/db_data:/var/lib/postgresql
      - ./postgres/backups:/backups
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: unless-stopped

volumes:
  bot_node_modules:
  amneziya_node_modules:

networks:
  backend:
    driver: bridge
