services:
  xray:
    image: ghcr.io/mhsanaei/3x-ui:v3.7.0@sha256:3b3131f1876e6bf35063a9ec4dd1c594e4525180bfc2e1c477dcc8a3c9550ca1
    container_name: xray-nl2
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: UTC
      XUI_ENABLE_FAIL2BAN: "false"
    volumes:
      - /var/lib/xray-nl2:/etc/x-ui
      - /var/lib/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/srv2.amneziya.mozhno.org:/cert:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: "0.75"
    cpu_shares: 128
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
