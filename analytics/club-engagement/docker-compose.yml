services:
  analysis:
    build:
      context: ../..
      dockerfile: analytics/club-engagement/Dockerfile
    working_dir: /workspace/analytics/club-engagement
    volumes:
      - ../..:/workspace
    command: ["python", "src/run_analysis.py"]

  notebook:
    build:
      context: ../..
      dockerfile: analytics/club-engagement/Dockerfile
    working_dir: /workspace/analytics/club-engagement
    volumes:
      - ../..:/workspace
    ports:
      - "127.0.0.1:8888:8888"
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.token=
      - --ServerApp.password=
